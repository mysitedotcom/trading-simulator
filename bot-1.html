<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tick Pattern Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #05070d; --panel: #0b1120; --panel2: #101a30; --line: rgba(120,160,255,.15);
  --ink: #d6e4ff; --muted: rgba(214,228,255,.62);
  --up: #3aa8f5; --down: #ff4d4d; --green: #2ecc71; --amber: #ffc24a;
  --ui: 'Manrope', Arial, sans-serif; --mono: 'JetBrains Mono', 'Courier New', monospace;
}
body {
  background: radial-gradient(900px 500px at 50% -10%, #0e1a36, var(--bg) 65%);
  color: #fff; font-family: var(--ui); min-height: 100vh;
  display: flex; justify-content: center;
  padding: calc(10px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom));
}
.app { width: 100%; max-width: 560px; display: grid; gap: 10px; align-content: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }

/* top bar */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 100px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 700 12px var(--ui); padding: 7px 11px; border-radius: 100px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--up); color: #04101c; }
.src { font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: 100px; border: 1px solid; }
.src.live { color: var(--green); border-color: rgba(46,204,113,.5); background: rgba(46,204,113,.08); }
.src.demo { color: var(--amber); border-color: rgba(255,194,74,.5); background: rgba(255,194,74,.08); }
.src.wait { color: var(--muted); border-color: var(--line); }
